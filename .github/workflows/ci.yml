name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run application checks
        run: |
          python -m py_compile app/app.py
          python -c "from app.app import app; client = app.test_client(); response = client.get('/health'); assert response.status_code == 200; print(response.json)"

      - name: Build Docker image
        run: |
          docker build -t production-kubernetes-platform:ci .

      - name: Verify Docker image
        run: |
          docker image inspect production-kubernetes-platform:ci
